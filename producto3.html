
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del producto | ROPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="encabezado-tienda">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <a href="index.html">
                    <img class="logo-tienda" src="img/logo.png" alt="Logotipo">
                </a>

                <nav class="menu-tienda">
                    <a href="index.html">Inicio</a>
                    <a href="nosotros.html">Nosotros</a>
                </nav>

                <a href="#" class="boton-carrito">
                    Carrito <span class="contador-valor">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="container pagina-producto">
        <div class="row align-items-center">
            <div class="col-12 col-md-6">
                <div class="contenedor-imagen">
                    <img src="img/3.jpg" alt="Imagen del producto">
                </div>
            </div>

            <!-- Información de los productos -->
            <div class="col-12 col-md-6">
                <section class="informacion-producto">
                    <p class="etiqueta-producto">NUESTRA COLECCIÓN</p>
                    <h1>React JS</h1>
                    <p class="precio-producto">$499.00 MXN</p>
                    <p class="descripcion-producto">
                        Descubre esta increíble prenda diseñada para ofrecerte
                        comodidad, calidad y estilo en cualquier ocasión.
                    </p>
                    <h2>Características</h2>
                    <ul class="caracteristicas-producto">
                        <li>Diseño moderno.</li>
                        <li>Material de calidad.</li>
                        <li>Ideal para diferentes ocasiones.</li>
                    </ul>

                    <!-- Formulario de compras -->
                    <form class="formulario" id="mi-formulario">
                        <label for="talla-producto">Selecciona tu talla:</label>
                        <select class="formulario__campo" id="talla-producto">
                            <option disabled selected>
                                -- Seleccionar Talla --
                            </option>
                            <option>Chica</option>
                            <option>Mediana</option>
                            <option>Grande</option>
                            <option>ExtraGrande</option>
                        </select>
                        <label for="cantidad">Cantidad:</label>
                        <input
                            class="formulario__campo"
                            type="number"
                            min="0"
                            value="1"
                            id="cantidad"
                            name="cantidad"
                        >

                        <div class="botones-producto">
                            <button
                                class="formulario__submit"
                                type="button">
                                Comprar ahora
                            </button>

                            <button
                                class="formulario__submit"
                                type="button"
                                id="btn-sumar">
                                Añadir al carrito
                            </button>
                        </div>
                    </form>
                    <a href="index.html" class="regresar-productos">
                        ← Regresar a productos
                    </a>
                </section>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="pie-tienda">
        <img src="img/logo.png" alt="Frontend Store">
    </footer>
<script src="js/script.js"></script>
</body>
</html>
